version: '3.9'

services:
  # ─────────────────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: codesync_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codesync
      POSTGRES_PASSWORD: codesync_pass
      POSTGRES_DB: codesync_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codesync -d codesync_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────
  # Redis (for future horizontal socket scaling)
  # ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: codesync_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3

  # ─────────────────────────────────────────────────────────
  # Backend (Node.js + Express + Socket.IO)
  # ─────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: ../docker/Dockerfile.server
    container_name: codesync_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://codesync:codesync_pass@postgres:5432/codesync_db
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_in_production_access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_in_production_refresh}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:80}
      EXECUTION_TIMEOUT_MS: 5000
      EXECUTION_MEMORY_LIMIT_MB: 64
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────────────────
  # Frontend (React + Nginx)
  # ─────────────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: ../docker/Dockerfile.client
    container_name: codesync_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '80:80'

volumes:
  postgres_data:

networks:
  default:
    name: codesync_network
